name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Tests
        run: pytest -q
      - name: Eval gate (mock mode)
        env:
          UAW_LLM: mock
        run: python -m harness.eval run --suite tests/goldens/repo.suite.json --threshold 0.9
      - name: Skill-meta eval gate (lint + audit + invariants)
        env:
          UAW_LLM: mock
        run: python -m harness.eval run --suite tests/goldens/skill_meta.suite.json --threshold 0.9

  bare-install-smoke:
    # Proves the zero-extras path: a plain `pip install -e .` must run every example
    # offline with no third-party wheels (no pyyaml / numpy / anthropic).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: python examples/eval_demo.py

  stock-macos-python:
    # The hooks run with whatever python3 the machine has. A stock Mac only has the Command Line
    # Tools' /usr/bin/python3 (3.9): the memory engine, the hooks and adopt must work there, with
    # no pip install of this package.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: /usr/bin/python3 --version
      - run: /usr/bin/python3 -m venv /tmp/py39 && /tmp/py39/bin/pip install -q pytest
      - name: Memory engine, hooks and adopt on the system python
        env:
          PYTHONPATH: src
        run: >-
          /tmp/py39/bin/python -m pytest -q tests/test_mdmemory_now.py
          tests/test_mdmemory_now_edgecases.py tests/test_mdmemory_notes.py
          tests/test_mdmemory_notes_edgecases.py tests/test_mdmemory_consolidate.py
          tests/test_mdmemory_consolidate_edgecases.py tests/test_mdmemory_maintenance.py
          tests/test_mdmemory_maintenance_edgecases.py tests/test_automation_hooks.py
          tests/test_autopilot_e2e.py
      - run: /usr/bin/python3 .claude/uaw/mdm.py lint
